<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Админ-панель</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⚙️ Админ</h1>
            <a href="{{ url_for('logout') }}" class="logout-btn">Выйти</a>
        </header>
        
        <div class="admin-tabs">
            <button class="tab-btn active" onclick="showTab('users')">👥 Юзеры</button>
            <button class="tab-btn" onclick="showTab('transactions')">📝 Транзакции</button>
            <button class="tab-btn" onclick="showTab('settings')">⚙️ Настройки</button>
        </div>
        
        <div id="usersTab" class="tab-content active">
            <h2>Пользователи</h2>
            <div class="admin-actions">
                <div class="form-group">
                    <input type="number" id="giveUserId" placeholder="Telegram ID">
                    <input type="number" step="0.01" id="giveAmount" placeholder="Сумма">
                    <button onclick="giveBalance()" class="btn-primary" style="padding: 12px 20px;">Выдать</button>
                </div>
            </div>
            <div id="usersList" class="admin-table"></div>
        </div>
        
        <div id="transactionsTab" class="tab-content">
            <h2>Все транзакции</h2>
            <div id="transactionsList" class="admin-table"></div>
        </div>
        
        <div id="settingsTab" class="tab-content">
            <h2>Настройки лимитов</h2>
            <form id="settingsForm">
                <div class="form-group">
                    <label>Мин. пополнение (₽)</label>
                    <input type="number" step="0.01" id="minDeposit" required>
                </div>
                <div class="form-group">
                    <label>Макс. пополнение (₽)</label>
                    <input type="number" step="0.01" id="maxDeposit" required>
                </div>
                <div class="form-group">
                    <label>Мин. вывод (₽)</label>
                    <input type="number" step="0.01" id="minWithdraw" required>
                </div>
                <div class="form-group">
                    <label>Макс. вывод (₽)</label>
                    <input type="number" step="0.01" id="maxWithdraw" required>
                </div>
                <button type="submit" class="btn-primary">Сохранить</button>
            </form>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
